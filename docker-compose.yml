version: '3.9'

services:
  # ═══════════════════════════════════════════════════════
  # BASE DE DONNÉES
  # ═══════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    container_name: brvm-db
    environment:
      POSTGRES_USER: brvm
      POSTGRES_PASSWORD: brvm
      POSTGRES_DB: brvm_terminal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brvm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════
  # CACHE & PUB/SUB
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: brvm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════
  # BACKEND API
  # ═══════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brvm-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://brvm:brvm@db:5432/brvm_terminal
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-in-prod}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ═══════════════════════════════════════════════════════
  # FRONTEND (SERVEUR STATIQUE)
  # ═══════════════════════════════════════════════════════
  frontend:
    image: nginx:alpine
    container_name: brvm-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
